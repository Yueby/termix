services:
  termix-server:
    build:
      # The lockfile and the workspace manifest are at the repository root, and pnpm needs
      # both to resolve the workspace. A packages/server-only context cannot provide them,
      # which is why the image never built.
      context: ../..
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - termix-data:/app/data
    environment:
      # No default is shipped. A literal in this file is a published signing key: anyone
      # who deploys with it can forge a token for any account. Compose refuses to start
      # until a real one is supplied.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a random value}
      # Leave empty to run without CAPTCHA; set it to protect registration and login.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - PORT=3000
    restart: unless-stopped

volumes:
  termix-data:

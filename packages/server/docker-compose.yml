services:
  termix-server:
    build:
      # The lockfile and the workspace manifest are at the repository root, and pnpm needs
      # both to resolve the workspace. A packages/server-only context cannot provide them,
      # which is why the image never built.
      context: ../..
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - termix-data:/app/data
    environment:
      # One shared secret, set here and in each client that syncs to it. Generate it with
      # `openssl rand -hex 32`. Compose refuses to start until it is supplied.
      - TERMIX_TOKEN=${TERMIX_TOKEN:?TERMIX_TOKEN must be set to a random value}
      - PORT=3000
    restart: unless-stopped

volumes:
  termix-data:

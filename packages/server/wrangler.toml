name = "termix-server"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

# Secrets (set via `wrangler secret put`):
#   TERMIX_TOKEN — the shared token every client sends as `Authorization: Bearer …`.
#                  Generate it with `openssl rand -hex 32` and put the same value in the
#                  client's sync settings.

[[d1_databases]]
binding = "DB"
database_name = "termix-db"
database_id = ""
# Drizzle generates the migrations into drizzle/, in the NNNN_name.sql form wrangler expects,
# so point it there rather than maintaining a second copy under the default directory.
migrations_dir = "drizzle"

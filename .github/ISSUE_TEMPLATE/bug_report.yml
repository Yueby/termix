name: Bug report
description: Something in Termix does not behave as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the app writes a log file that usually says what happened. Its
        location is shown in **Settings → About**, and a disconnect or a failed
        connection is recorded there with its reason. Attaching the relevant lines
        makes this far quicker to resolve.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a connection to …
        2. Do …
        3. See …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Termix version
      description: Shown in Settings → About.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste the lines around the event. Remove anything private first.
      render: text
    validations:
      required: false

  - type: input
    id: remote
    attributes:
      label: Remote server (if the bug involves SSH or SFTP)
      description: Operating system and SSH daemon, e.g. "Debian 13, OpenSSH 10.0p2". Do not paste host names you want to keep private.
    validations:
      required: false

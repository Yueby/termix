version: 2
updates:
  # Frontend and server dependencies. Both live in the same pnpm workspace, so one
  # entry at the root covers packages/*.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Toolchain bumps are noisy on their own; keep them in one PR.
      dev-tooling:
        patterns:
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "tsup"
          - "tsx"
      tauri:
        patterns:
          - "@tauri-apps/*"
    ignore:
      # Deliberately held back: TypeScript 7 is a compiler rewrite and Tauri 3 is
      # still alpha. Revisit as a considered migration, not a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/packages/client/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # russh, ssh-key and russh-sftp have to move together.
      ssh-stack:
        patterns:
          - "russh*"
          - "ssh-key"
    ignore:
      # sqlx 0.9 requires rustc 1.94.0 and the project is on 1.93.1, so this bump
      # cannot compile. Drop this entry once the toolchain moves.
      - dependency-name: "sqlx"
        update-types: ["version-update:semver-major"]

  # Keep the actions used by the workflows current — as ONE pull request, so a
  # routine action bump does not arrive as four.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

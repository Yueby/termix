name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri's Linux build needs the system webkit stack (see the install step below).
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from `packageManager` in package.json. Do not pin it here
      # as well — pnpm/action-setup errors when the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` is `tsc && vite build`, so this covers the typecheck too.
      - run: pnpm --filter @termix/client build

  # Advisory: packages/server has never been typechecked before (its tsconfig asked
  # for `node` types without declaring them), and turning that on surfaced a handful
  # of real errors there. None of them affect the desktop app, and fixing them means
  # deciding how the package should type itself for Node *and* Workers, so the job
  # reports rather than blocks. Tracked in the release notes.
  server:
    name: Server (typecheck, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @termix/server exec tsc --noEmit

  rust:
    name: Rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_LINUX_DEPS }}

      - run: pnpm install --frozen-lockfile

      - run: cargo check --manifest-path packages/client/src-tauri/Cargo.toml --all-targets

      # The network-dependent tests are #[ignore]d on purpose — run them locally with
      # `cargo test --lib -- --include-ignored` while a proxy is available.
      - run: cargo test --manifest-path packages/client/src-tauri/Cargo.toml --lib

  # Advisory only: the codebase is not rustfmt-clean and clippy reports a handful of
  # design-level warnings (mostly "too many arguments"). Neither may fail the build
  # yet, but they run so the debt stays visible.
  rust-lint:
    name: Rust lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_LINUX_DEPS }}

      - run: cargo fmt --manifest-path packages/client/src-tauri/Cargo.toml -- --check

      - run: cargo clippy --manifest-path packages/client/src-tauri/Cargo.toml --all-targets

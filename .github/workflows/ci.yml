name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri's Linux build needs the system webkit stack (see the install step below).
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json. Do not pin it here
      # as well — pnpm/action-setup errors when the two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` is `tsc && vite build`, so this covers the typecheck too.
      - run: pnpm --filter @termix/client build

      # Pure logic only — key-type detection, which reads structured fields because a
      # substring search over base64 gives random answers.
      - run: pnpm --filter @termix/client test

  server:
    name: Server (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This package ships two runtimes — Node for self-hosting, Workers for the
      # deployment described in wrangler.toml — and a single tsconfig cannot describe
      # both, because the Workers globals and the Node globals collide. `typecheck`
      # therefore runs tsc twice, once per target, and both must pass.
      - run: pnpm --filter @termix/server typecheck

      # Reachable only at runtime: the middleware-ordering defect, the token-audience
      # defect and the concurrent-push defect all typechecked cleanly. A typecheck cannot
      # tell you that a handler ran with an empty context.
      - run: pnpm --filter @termix/server test

      # The Worker is a second build target, and the Node build says nothing about it: a
      # native dependency reachable from the Worker's import graph fails here and nowhere
      # else. This is what caught argon2 being reachable from the shared crypto module,
      # which had made `wrangler deploy` fail outright with `Could not resolve "os"`.
      - run: pnpm --filter @termix/server exec wrangler deploy --dry-run --outdir /tmp/termix-worker

  rust:
    name: Rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_LINUX_DEPS }}

      - run: pnpm install --frozen-lockfile

      - run: cargo check --manifest-path packages/client/src-tauri/Cargo.toml --all-targets

      # The network-dependent tests are #[ignore]d on purpose — run them locally with
      # `cargo test --lib -- --include-ignored` while a proxy is available.
      - run: cargo test --manifest-path packages/client/src-tauri/Cargo.toml --lib

  # Formatting is gated: the tree is rustfmt-clean, so a diff here is a new one.
  rust-format:
    name: Rust (format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --manifest-path packages/client/src-tauri/Cargo.toml -- --check

  # Clippy is clean, so it gates. The few lints that cannot be satisfied — argument counts
  # on signatures the IPC contract fixes, and one handler whose signature russh imposes —
  # carry a targeted allow with its reason written down, rather than the job being told to
  # ignore itself.
  rust-clippy:
    name: Rust (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_LINUX_DEPS }}

      - run: cargo clippy --manifest-path packages/client/src-tauri/Cargo.toml --all-targets

name: Release

# Triggered by pushing a tag like v0.2.0. The manual entry point exists so a release
# can be rebuilt without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  # Reading the check runs for the release commit, so a release cannot be built from a
  # revision CI never saw.
  checks: read
  # Resolving each commit to the pull request it came from needs this; without it
  # git-cliff's lookups are refused and the entries come out with no PR link.
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs first and fails fast. Everything below signs and publishes four platforms, so a
  # mismatch caught here is four builds that never happen.
  verify:
    name: Verify the release is coherent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tag that was asked for. A manual run used to check out whatever
          # revision it was dispatched from and then label those assets with the requested
          # tag, so "rebuild v0.1.0" did not rebuild v0.1.0.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the four version fields agree with the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          expected="${TAG#v}"
          fail=0

          check() {
            local label="$1" actual="$2"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label says $actual, the tag says $expected"
              fail=1
            else
              echo "$label: $actual"
            fi
          }

          # Four files carry the product version and nothing kept them in step; the
          # documented bump is four manual edits. The tag is the authority here.
          check "tauri.conf.json"     "$(node -p "require('./packages/client/src-tauri/tauri.conf.json').version")"
          check "client package.json" "$(node -p "require('./packages/client/package.json').version")"
          check "server package.json" "$(node -p "require('./packages/server/package.json').version")"
          check "Cargo.toml"          "$(awk -F'"' '/^version = /{print $2; exit}' packages/client/src-tauri/Cargo.toml)"

          exit "$fail"

      - name: Require the checks to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)

          # This workflow's own run is one of the checks on this commit, and it is the one
          # asking. Counting it makes the gate impossible to satisfy: it is in progress while
          # the question is being asked, and a moment later it is the run that failed.
          runs=$(gh run list --commit "$sha" --limit 100 --json workflowName,conclusion \
            --jq '[.[] | select(.workflowName != "Release")]')

          total=$(echo "$runs" | jq 'length')
          # Nothing else guarantees that the revision being signed and published is one CI has
          # looked at: a tag can point anywhere.
          if [ "$total" -eq 0 ]; then
            echo "::error::No checks ran for $sha. Release a revision CI has seen — merge to main and let it pass first."
            exit 1
          fi

          bad=$(echo "$runs" | jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")]')
          if [ "$(echo "$bad" | jq 'length')" -ne 0 ]; then
            echo "$bad" | jq -r '.[] | "::error::\(.workflowName): \(.conclusion)"'
            exit 1
          fi

          echo "All $total checks passed for $sha."

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - label: Linux (x86_64)
            platform: ubuntu-22.04
            args: ""
            targets: ""
          - label: Windows (x86_64)
            platform: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # Version comes from `packageManager` — do not pin it here too.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target
          key: ${{ matrix.args }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        env:
          # git-cliff resolves each commit to the pull request it came from and looks up
          # contributors through the GitHub API, which needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts are signed with this key; the matching public key lives in
          # tauri.conf.json, and `bundle.createUpdaterArtifacts` makes a missing or
          # mismatched key fail the build rather than produce an unusable update.
          #
          # Scoped to this step rather than the job. At job level the key was inherited by
          # dependency installation, the release-note generator and every third-party
          # action, so a compromised install script or action could read the key that
          # signs what users auto-install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/client
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Termix ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.content }}
          # A draft, deliberately: the updater endpoint is
          # `releases/latest/download/latest.json`, and GitHub's `/releases/latest`
          # excludes drafts and prereleases. The update only reaches users once a
          # human publishes this release. See CONTRIBUTING.md.
          releaseDraft: true
          prerelease: false
          # The input is `uploadUpdaterJson` (the default is true anyway, but saying
          # it explicitly means a change of default upstream cannot silently stop
          # shipping the manifest that updates depend on).
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

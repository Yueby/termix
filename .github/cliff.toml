# git-cliff configuration.
#
# Produces the GitHub release notes for a tag; see the release workflow. There is no
# CHANGELOG.md in this repository — the changelog *is* the release notes, derived from
# the commit history rather than maintained by hand.
#
# Commits follow the conventional-commit style already in use here, so grouping is by
# prefix rather than by PR label.

[changelog]
trim = true
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
footer = ""

[git]
conventional_commits = true
# Keep non-conventional subjects (`Update .gitignore`, `Initial commit`) rather than
# dropping them silently — they land in "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  # A merge commit carries the PR title as its subject and the squashed commit's
  # subject in its body, so leaving these in duplicates the entry right below and
  # drags stray blank lines into the output. Must come before the catch-all.
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore|^ci|^build", group = "Maintenance" },
  { message = ".*", group = "Other" },
]
